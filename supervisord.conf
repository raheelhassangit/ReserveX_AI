[supervisord]
nodaemon=true

[program:web]
command=gunicorn config.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A config worker -B -l info -P solo -S django_celery_beat.schedulers:DatabaseScheduler
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0